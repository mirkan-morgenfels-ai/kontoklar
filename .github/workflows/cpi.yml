name: Destatis CPI aktualisieren

on:
  schedule:
    - cron: "0 6 15 * *"
  workflow_dispatch:

jobs:
  cpi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web cpi:build
        env:
          DESTATIS_TOKEN: ${{ secrets.DESTATIS_TOKEN }}
      - run: pnpm --filter web test
      - name: Änderung committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/k2/cpi.json
          git diff --cached --quiet || git commit -m "data(k2): Destatis-CPI aktualisiert"
          git push
