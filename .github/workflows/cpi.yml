name: Destatis CPI aktualisieren

on:
  schedule:
    - cron: "0 6 15 * *"
  workflow_dispatch:

jobs:
  cpi:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Secret DESTATIS_TOKEN prüfen
        id: token
        env:
          DESTATIS_TOKEN: ${{ secrets.DESTATIS_TOKEN }}
        run: |
          if [ -z "$DESTATIS_TOKEN" ]; then
            echo "::notice title=Destatis CPI übersprungen::Das Repository-Secret DESTATIS_TOKEN ist nicht gesetzt. data/k2/cpi.json bleibt unverändert. Secret unter Settings > Secrets and variables > Actions anlegen und den Workflow von Hand starten."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.available == 'true'
        uses: actions/checkout@v7
      - if: steps.token.outputs.available == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.token.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: steps.token.outputs.available == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.token.outputs.available == 'true'
        run: pnpm --filter web cpi:build
        env:
          DESTATIS_TOKEN: ${{ secrets.DESTATIS_TOKEN }}
      - if: steps.token.outputs.available == 'true'
        run: pnpm --filter web test
      - name: Änderung committen
        if: steps.token.outputs.available == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/k2/cpi.json
          git diff --cached --quiet || git commit -m "data(k2): Destatis-CPI aktualisiert"
          git push
